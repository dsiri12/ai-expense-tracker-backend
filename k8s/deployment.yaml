apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-expense-tracker-backend-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-expense-tracker-backend

  template:
    metadata:
      labels:
        app: ai-expense-tracker-backend

    spec:
      containers:
        - name: ai-expense-tracker-backend
          image: ai-expense-tracker-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: ai-expense-tracker-configmap

            - secretRef:
                name: ai-expense-tracker-backend-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
